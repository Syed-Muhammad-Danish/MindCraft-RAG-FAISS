<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MindCraft{% endblock %}</title>

    {% block exHead %} {% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    {% load static %}
<link href="{% static 'css/styles.css' %}?v={% now 'U' %}" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen">


    {% if user.is_authenticated %}

         <nav class="navbar">
        <div class="container" >
            <a href="{% url 'study_home' %}" class="nav-logo">MindCraft</a>
            <div class="nav-links">
                 <span class="mr-4">Logged in as {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="nav-button" style="background: #d10606;">Logout</a>
            </div>
        </div>
</nav>

    <div class="flex flex-1">
        <aside class="w-64 bg-white shadow-md h-screen p-4 fixed">
            <h2 class="text-xl font-bold mb-4">Users</h2>
            {% block sidebar %}
            {% endblock %}
        </aside>
        <div class="flex-1 ml-64">
            <main class="p-6">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
    {% else %}
    <main class="flex flex-col min-h-screen bg-gray-100">
   <nav class="navbar">
        <div class="container">
            <a href="{% url 'login' %}" class="nav-logo">MindCraft</a>
            <div class="nav-links">
                <a href="{% url 'login' %}" class="nav-link">Login</a>
                <a href="{% url 'signup' %}" class="nav-button" style="background: #00e6b8;">Signup</a>
            </div>
        </div>
    </nav>



  <div class="flex-1 flex items-center justify-center">
    <div class="w-3/4 h-3/4 p-6 text-center">

         {% block content1 %}
        {% endblock %}


    </div>
</div>

</main>

    {% endif %}
</body>
</html>
